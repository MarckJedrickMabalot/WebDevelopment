  <style>
    body {
      background-color: #141a47;
    }

    .logo img {
      max-width: 100%;
      height: 140px;
      object-fit: contain;
    }

    .card {
      min-height: 100px;
      border: 2px solid #2a3480;
      color: white;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      flex-shrink: 0;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card h5 {
      margin-bottom: 12px;
    }
  </style>
